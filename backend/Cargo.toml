[package]
name = "fintech-backend"
version = "0.1.0"
edition = "2021"
description = "High-performance fintech backend for mobile money and P2P payments"
authors = ["Fintech Team"]

[dependencies]
# Web framework
actix-web = "4.4"
actix-rt = "2.9"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Security
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.21"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Authentication
jsonwebtoken = "9.2"

# Caching
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
dotenvy = "0.15"
config = "0.14"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Metrics
prometheus = "0.13"

# HTTP client for external APIs
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Utility
once_cell = "1.19"

[dev-dependencies]
actix-rt = "2.9"
mockall = "0.12"

[[bin]]
name = "server"
path = "src/main.rs"

[lib]
name = "fintech_backend"
path = "src/lib.rs"

# Authentication middleware
actix-web-httpauth = "0.8"
rand = "0.8"
rust_decimal = { version = "1.33", features = ["serde"] }
